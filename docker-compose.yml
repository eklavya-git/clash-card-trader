services:
  postgres:
    image: postgres:17
    container_name: clash-card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clash_card_trader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: